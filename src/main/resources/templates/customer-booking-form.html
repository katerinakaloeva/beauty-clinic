<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κράτηση Ραντεβού | Beauty Clinic</title>

    <link rel="stylesheet" th:href="@{/css/customer-booking-form.css}">
</head>

<body>

<div class="page-wrapper">
    <main class="booking-card">

        <header class="page-header">
            <a class="back-link" th:href="@{/home}">
                ← Αρχική
            </a>

            <p class="eyebrow">Beauty Clinic</p>
            <h1>Κλείσε το ραντεβού σου</h1>
            <p class="intro">
                Επίλεξε υπηρεσία, ημερομηνία και ώρα έναρξης.
                Η ώρα λήξης υπολογίζεται αυτόματα.
            </p>
        </header>

        <form class="booking-form"
              th:action="@{/bookings}"
              th:object="${booking}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label for="treatmentId">Υπηρεσία</label>

                <select id="treatmentId" th:field="*{treatmentId}">
                    <option value="">Επίλεξε υπηρεσία</option>

                    <option th:each="treatment : ${treatments}"
                            th:value="${treatment.id}"
                            th:text="${treatment.name}">
                    </option>
                </select>

                <p class="error-message"
                   th:if="${#fields.hasErrors('treatmentId')}"
                   th:errors="*{treatmentId}">
                </p>
            </div>

            <div class="form-group">
                <label for="appointmentDate">Ημερομηνία</label>

                <input id="appointmentDate"
                       type="date"
                       th:field="*{appointmentDate}">

                <p class="error-message"
                   th:if="${#fields.hasErrors('appointmentDate')}"
                   th:errors="*{appointmentDate}">
                </p>
            </div>

            <div class="form-group">
                <label for="startTime">Ώρα έναρξης</label>

                <select id="startTime"
                        th:field="*{startTime}"
                        disabled>
                    <option value="">
                        Επίλεξε πρώτα υπηρεσία και ημερομηνία
                    </option>
                </select>

                <p class="error-message"
                   th:if="${#fields.hasErrors('startTime')}"
                   th:errors="*{startTime}">
                </p>
            </div>

            <div class="time-note">
                <span class="time-note-icon">◷</span>
                <p>
                    Οι διαθέσιμες ώρες υπολογίζονται αυτόματα,
                    με βάση την υπηρεσία και την ημερομηνία που επέλεξες.
                </p>
            </div>

            <button class="submit-btn" type="submit">
                Επιβεβαίωση κράτησης
            </button>
        </form>

    </main>
</div>

<script>
    const treatmentSelect = document.getElementById("treatmentId");
    const appointmentDateInput = document.getElementById("appointmentDate");
    const startTimeSelect = document.getElementById("startTime");

    async function loadAvailableTimes() {
        const treatmentId = treatmentSelect.value;
        const appointmentDate = appointmentDateInput.value;

        startTimeSelect.innerHTML = "";
        startTimeSelect.disabled = true;

        const firstOption = document.createElement("option");
        firstOption.value = "";
        startTimeSelect.appendChild(firstOption);

        if (!treatmentId || !appointmentDate) {
            firstOption.textContent =
                "Επίλεξε πρώτα υπηρεσία και ημερομηνία";
            return;
        }

        const response = await fetch(
            `/bookings/available-times?treatmentId=${treatmentId}&appointmentDate=${appointmentDate}`
        );

        const availableTimes = await response.json();

        if (availableTimes.length === 0) {
            firstOption.textContent =
                "Δεν υπάρχουν διαθέσιμες ώρες";
            return;
        }

        firstOption.textContent = "Επίλεξε ώρα";

        availableTimes.forEach(time => {
            const option = document.createElement("option");
            const formattedTime = time.substring(0, 5);

            option.value = formattedTime;
            option.textContent = formattedTime;

            startTimeSelect.appendChild(option);
        });

        startTimeSelect.disabled = false;
    }

    treatmentSelect.addEventListener("change", loadAvailableTimes);
    appointmentDateInput.addEventListener("change", loadAvailableTimes);
</script>

</body>
</html>
