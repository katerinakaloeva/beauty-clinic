<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Εγγραφή | Beauty Clinic</title>

    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>

<div class="page-wrapper">

    <main class="app-card">

        <header class="header">
            <a class="back-link"
               th:href="@{/login}"
               aria-label="Επιστροφή στη σύνδεση">
                ←
            </a>

            <div>
                <p class="small-title">Beauty Clinic</p>
                <h1>Δημιουργία λογαριασμού</h1>
            </div>
        </header>

        <p class="intro-text">
            Συμπλήρωσε τα στοιχεία σου για να κλείνεις τα ραντεβού σου online.
        </p>

        <form th:action="@{/register}"
              th:object="${user}"
              method="post">

            <!-- CSRF token: προστατεύει το POST registration request -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="global-error"
                 th:if="${#fields.hasGlobalErrors()}"
                 role="alert">
                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}">
                </p>
            </div>

            <div class="form-group">
                <label for="fullName">Ονοματεπώνυμο</label>

                <input id="fullName"
                       type="text"
                       autocomplete="name"
                       th:field="*{fullName}">

                <p class="error-message"
                   th:if="${#fields.hasErrors('fullName')}"
                   th:errors="*{fullName}">
                </p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input id="email"
                       type="email"
                       autocomplete="email"
                       th:field="*{email}">

                <p class="error-message"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>
            </div>

            <div class="form-group">
                <label for="password">Κωδικός</label>

                <input id="password"
                       type="password"
                       autocomplete="new-password"
                       th:field="*{password}">

                <p class="error-message"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">
                </p>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Επιβεβαίωση κωδικού</label>

                <input id="confirmPassword"
                       type="password"
                       autocomplete="new-password"
                       th:field="*{confirmPassword}">

                <p class="error-message"
                   th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}">
                </p>
            </div>

            <button class="submit-btn" type="submit">
                Δημιουργία λογαριασμού
            </button>
        </form>

        <p class="login-text">
            Έχεις ήδη λογαριασμό;
            <a th:href="@{/login}">Σύνδεση</a>
        </p>

    </main>

</div>

</body>
</html>
