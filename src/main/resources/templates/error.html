<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σφάλμα | Beauty Clinic</title>

    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>

<body>

<main class="page-wrapper">

    <section class="error-card">
        <div class="error-icon" aria-hidden="true">!</div>

        <p class="eyebrow">Beauty Clinic</p>
        <h1>Κάτι δεν πήγε καλά</h1>
        <p class="description">
            Δεν ήταν δυνατό να ολοκληρωθεί η ενέργειά σου.
        </p>

        <div class="error-message" th:if="${errorMessage}">
            <p th:text="${errorMessage}"></p>
        </div>

        <a class="home-btn" th:href="@{/home}">
            Επιστροφή στην αρχική
        </a>
    </section>

</main>

</body>
</html>
